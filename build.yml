name: Build Gmu for RG52MINI (AArch64 TTF + EQ)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Gmu source
        uses: actions/checkout@v4
        with:
          repository: jhe2/gmu
          path: gmu-src

      - name: Checkout our patches
        uses: actions/checkout@v4
        with:
          path: our-patches

      - name: Apply EQ patches
        run: |
          cp our-patches/patches/audio.h gmu-src/src/audio.h
          cp our-patches/patches/audio.c gmu-src/src/audio.c
          echo "EQ patches applied"

      - name: Install AArch64 cross-compiler
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config

      - name: Setup arm64 apt and install SDL2 dev libs
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt update
          sudo apt install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64
          echo "SDL2 arm64 libs installed"

      - name: Configure Gmu
        run: |
          cd gmu-src
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          ./configure --target-device=unknown
          echo "=== Fixing Makefile for cross-compile ==="
          sed -i 's/-fstrict-flex-arrays=3//g' Makefile
          sed -i 's/ -Werror[^ ]*//g' Makefile
          sed -i 's/-DSDLFE_WITHOUT_SDL_TTF=1/-DSDLFE_WITHOUT_SDL_TTF=0/g' Makefile
          sed -i '1i CFLAGS+=-D_GNU_SOURCE' Makefile
          grep CFLAGS Makefile | head -10

      - name: Build Gmu
        run: |
          cd gmu-src
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          make -j$(nproc)
          echo "=== Build output ==="
          ls -lh gmu.bin frontends/sdl.so
          file gmu.bin
          echo "=== TTF check ==="
          aarch64-linux-gnu-readelf -d frontends/sdl.so | grep -i needed || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmu-rg52mini-aarch64-ttf-eq
          path: |
            gmu-src/gmu.bin
            gmu-src/frontends/sdl.so
            gmu-src/decoders/*.so
          if-no-files-found: warn
