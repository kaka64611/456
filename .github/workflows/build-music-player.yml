name: Build RG52MINI Music Player (AArch64)

on:
  push:
    branches: [ main ]
    paths:
      - 'rg52mini-music/**'
      - '.github/workflows/build-music-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install AArch64 cross-compiler
      run: |
        sudo apt update
        sudo apt install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config
    
    - name: Setup arm64 apt and install SDL2 dev libs
      run: |
        sudo dpkg --add-architecture arm64
        sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        sudo apt update
        sudo apt install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64 libsdl2-mixer-dev:arm64
    
    - name: Build for AArch64
      env:
        CC: aarch64-linux-gnu-gcc
        CXX: aarch64-linux-gnu-g++
        PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
      run: |
        cd rg52mini-music
        make clean
        make all 2>&1 | tee build.log
        ls -lh bin/rg52mini-music
        file bin/rg52mini-music
    
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: rg52mini-music/build.log
    
    - name: Prepare package
      run: |
        mkdir -p package/rg52mini-music
        cp rg52mini-music/bin/rg52mini-music package/rg52mini-music/
        cp -r rg52mini-music/src package/rg52mini-music/ 2>/dev/null || true
        cp rg52mini-music/Makefile package/rg52mini-music/ 2>/dev/null || true
        cd package && tar czf ../rg52mini-music-aarch64.tar.gz rg52mini-music
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: rg52mini-music-aarch64
        path: rg52mini-music-aarch64.tar.gz
    
    - name: Commit binary to repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p bin
        cp rg52mini-music/bin/rg52mini-music bin/rg52mini-music
        git add bin/rg52mini-music
        git commit -m "Add compiled RG52MINI Music Player AArch64 binary" || echo "No changes to commit"
        git pull --rebase origin main || true
        git push || echo "Push failed, binary available as artifact"
