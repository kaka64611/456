name: Build RG52MINI TV Player (AArch64)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install AArch64 cross-compiler
      run: |
        sudo apt update
        sudo apt install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Setup arm64 apt and install SDL2 dev libs
      run: |
        sudo dpkg --add-architecture arm64
        sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        sudo apt update
        sudo apt install -y libsdl2-dev:arm64 libsdl2-ttf-dev:arm64
        echo "=== SDL2 headers ==="
        ls /usr/include/SDL2/SDL.h
        echo "=== SDL2 libs ==="
        ls /usr/lib/aarch64-linux-gnu/libSDL2*

    - name: Build for AArch64
      run: |
        cd rg52mini-tv
        set -x
        mkdir -p obj
        # Compile each file individually to see errors
        for f in src/*.c; do
          echo "=== Compiling $f ==="
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE -D_REENTRANT \
            -I/usr/include/SDL2 -Iinclude -c -o obj/$(basename $f .c).o $f 2>&1
          if [ $? -ne 0 ]; then
            echo "FAILED: $f"
            exit 1
          fi
        done
        echo "=== Linking ==="
        aarch64-linux-gnu-gcc -O2 -L/usr/lib/aarch64-linux-gnu -o rg52mini-tv obj/*.o \
          -lSDL2 -lSDL2_ttf -lpthread -lm -ldl 2>&1
        if [ $? -ne 0 ]; then
          echo "LINK FAILED"
          exit 1
        fi
        file rg52mini-tv
        echo "=== Build success ==="

    - name: Prepare package
      run: |
        mkdir -p package/ports/rg52mini-tv/assets/fonts
        mkdir -p package/ports_scripts
        cp rg52mini-tv/rg52mini-tv package/ports/rg52mini-tv/
        cp rg52mini-tv/assets/fonts/NotoSansCJKsc-Regular.otf package/ports/rg52mini-tv/assets/fonts/
        cp -r rg52mini-tv/libs package/ports/rg52mini-tv/
        cp rg52mini-tv/RG52MINI\ TV\ Player.sh package/ports_scripts/
        cp rg52mini-tv/使用说明.txt package/
        cd package && zip -r ../rg52mini-tv-ee47.zip .

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: rg52mini-tv-binary
        path: rg52mini-tv/rg52mini-tv

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: rg52mini-tv-package
        path: rg52mini-tv-ee47.zip

    - name: Commit binary to repo
      run: |
        mkdir -p bin
        cp rg52mini-tv/rg52mini-tv bin/
        git config user.name "rg52mini-tv"
        git config user.email "rg52mini@example.com"
        git add bin/rg52mini-tv
        git commit -m "Build: rg52mini-tv AArch64 binary" || echo "No changes to commit"
        git push
