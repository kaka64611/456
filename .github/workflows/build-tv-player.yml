name: Build RG52MINI TV Player (AArch64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup arm64 cross-compile
        run: |
          sudo dpkg --add-architecture arm64
          # Keep amd64 sources, add arm64 ports sources
          sudo bash -c 'cat >> /etc/apt/sources.list.d/arm64-cross.list << EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe multiverse
          EOF'
          # Configure apt to not fail on missing arch for security.ubuntu.com
          echo 'APT::Architectures "amd64,arm64";' | sudo tee /etc/apt/apt.conf.d/00architectures
          sudo apt-get update 2>&1 | tail -5 || true

      - name: Install toolchain and libs
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y libsdl2-dev:arm64 libsdl2-ttf-dev:arm64 libmpv-dev:arm64
          echo "=== Verify headers ==="
          ls /usr/include/mpv/client.h 2>/dev/null && echo "mpv headers OK" || echo "mpv headers MISSING"
          ls /usr/include/SDL2/SDL.h 2>/dev/null && echo "SDL2 headers OK" || echo "SDL2 headers MISSING"
          echo "=== Verify libs ==="
          ls /usr/lib/aarch64-linux-gnu/libmpv.so* 2>/dev/null && echo "libmpv OK" || echo "libmpv MISSING"
          ls /usr/lib/aarch64-linux-gnu/libSDL2.so* 2>/dev/null && echo "libSDL2 OK" || echo "libSDL2 MISSING"

      - name: Build for AArch64
        run: |
          cd rg52mini-tv
          make CC=aarch64-linux-gnu-gcc clean || true
          make CC=aarch64-linux-gnu-gcc
          file rg52mini-tv

      - name: Prepare package
        run: |
          mkdir -p package/ports/rg52mini-tv/assets/fonts
          mkdir -p package/ports_scripts
          cp rg52mini-tv/rg52mini-tv package/ports/rg52mini-tv/
          cp rg52mini-tv/assets/fonts/NotoSansCJKsc-Regular.otf package/ports/rg52mini-tv/assets/fonts/
          cp -r rg52mini-tv/libs package/ports/rg52mini-tv/
          cp rg52mini-tv/RG52MINI\ TV\ Player.sh package/ports_scripts/
          cp rg52mini-tv/使用说明.txt package/
          cd package && zip -r ../rg52mini-tv-ee47.zip .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rg52mini-tv-binary
          path: rg52mini-tv/rg52mini-tv

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rg52mini-tv-package
          path: rg52mini-tv-ee47.zip

      - name: Commit binary to repo
        run: |
          mkdir -p bin
          cp rg52mini-tv/rg52mini-tv bin/
          git config user.name "rg52mini-tv"
          git config user.email "rg52mini@example.com"
          git add bin/rg52mini-tv
          git commit -m "Build: rg52mini-tv AArch64 binary" || echo "No changes to commit"
          git push
