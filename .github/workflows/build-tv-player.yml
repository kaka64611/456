name: Build RG52MINI TV Player (AArch64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup arm64 multiarch
        run: |
          sudo dpkg --add-architecture arm64
          # Replace security.ubuntu.com with ports.ubuntu.com for arm64
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          # Add arm64 specific sources
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update || true

      - name: Install toolchain and libs
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y libsdl2-dev:arm64 libsdl2-ttf-dev:arm64 libmpv-dev:arm64 || true
          # Verify libmpv headers
          ls /usr/include/mpv/ || echo "mpv headers not found, using fallback"
          ls /usr/lib/aarch64-linux-gnu/libmpv* || echo "libmpv not found"

      - name: Build for AArch64
        run: |
          cd rg52mini-tv
          make CC=aarch64-linux-gnu-gcc clean || true
          make CC=aarch64-linux-gnu-gcc
          file rg52mini-tv

      - name: Prepare package
        run: |
          mkdir -p package/ports/rg52mini-tv/assets/fonts
          mkdir -p package/ports_scripts
          cp rg52mini-tv/rg52mini-tv package/ports/rg52mini-tv/
          cp rg52mini-tv/assets/fonts/NotoSansCJKsc-Regular.otf package/ports/rg52mini-tv/assets/fonts/
          cp -r rg52mini-tv/libs package/ports/rg52mini-tv/
          cp rg52mini-tv/RG52MINI\ TV\ Player.sh package/ports_scripts/
          cp rg52mini-tv/使用说明.txt package/
          cd package && zip -r ../rg52mini-tv-ee47.zip .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rg52mini-tv-binary
          path: rg52mini-tv/rg52mini-tv

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rg52mini-tv-package
          path: rg52mini-tv-ee47.zip

      - name: Commit binary to repo
        run: |
          mkdir -p bin
          cp rg52mini-tv/rg52mini-tv bin/
          git config user.name "rg52mini-tv"
          git config user.email "rg52mini@example.com"
          git add bin/rg52mini-tv
          git commit -m "Build: rg52mini-tv AArch64 binary" || echo "No changes to commit"
          git push
