name: Build RG52MINI TV Player (AArch64)

on:
  push:
    branches: [ main ]
    paths:
      - 'rg52mini-tv/**'
      - '.github/workflows/build-tv-player.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install AArch64 cross-compiler
      run: |
        sudo apt update
        sudo apt install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config

    - name: Setup arm64 apt and install SDL2 dev libs
      run: |
        sudo dpkg --add-architecture arm64
        sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        sudo apt update
        sudo apt install -y libsdl2-dev:arm64 libsdl2-ttf-dev:arm64 libffi8:arm64

    - name: Build for AArch64
      env:
        CC: aarch64-linux-gnu-gcc
        PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
      run: |
        cd rg52mini-tv
        mkdir -p obj
        SDL_CFLAGS=$(pkg-config --cflags sdl2 SDL2_ttf)
        SDL_LIBS=$(pkg-config --libs sdl2 SDL2_ttf)
        echo "SDL_CFLAGS: $SDL_CFLAGS"
        echo "SDL_LIBS: $SDL_LIBS"
        for f in src/*.c; do
          echo "=== Compiling $f ==="
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE -D_REENTRANT \
            $SDL_CFLAGS -Iinclude -c -o obj/$(basename $f .c).o $f 2>&1
          if [ $? -ne 0 ]; then
            echo "FAILED: $f"
            exit 1
          fi
        done
        echo "=== Linking ==="
        aarch64-linux-gnu-gcc -O2 -o rg52mini-tv obj/*.o \
          $SDL_LIBS -lpthread -lm -ldl 2>&1
        if [ $? -ne 0 ]; then
          echo "LINK FAILED"
          exit 1
        fi
        file rg52mini-tv
        echo "=== Build success ==="

    - name: Prepare package (collect ALL dependencies)
      run: |
        mkdir -p package/ports/rg52mini-tv/assets/fonts
        mkdir -p package/ports_scripts
        cp rg52mini-tv/rg52mini-tv package/ports/rg52mini-tv/
        cp rg52mini-tv/assets/fonts/NotoSansCJKsc-Regular.otf package/ports/rg52mini-tv/assets/fonts/
        cp -r rg52mini-tv/libs package/ports/rg52mini-tv/
        cp "rg52mini-tv/RG52MINI TV Player.sh" package/ports_scripts/
        cp rg52mini-tv/使用说明.txt package/

        # Recursively collect ALL shared library dependencies
        DEST=package/ports/rg52mini-tv/libs
        collect_deps() {
          local bin="$1"
          local needed=$(aarch64-linux-gnu-readelf -d "$bin" 2>/dev/null | grep NEEDED | awk '{print $5}' | tr -d '[]')
          for lib in $needed; do
            if [ -f "$DEST/$lib" ]; then continue; fi
            local found=$(find /usr/lib/aarch64-linux-gnu /lib/aarch64-linux-gnu /usr/lib -name "$lib" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "  + $lib"
              cp "$found" "$DEST/$lib"
              collect_deps "$found"
            fi
          done
        }
        echo "=== Collecting dependencies for rg52mini-tv ==="
        collect_deps rg52mini-tv/rg52mini-tv
        echo "=== Also collecting for libmpv (it has many deps) ==="
        if [ -f "$DEST/libmpv.so.2" ]; then
          collect_deps "$DEST/libmpv.so.2"
        fi
        echo "=== Total libs in package: ==="
        ls -1 "$DEST" | wc -l
        ls -lh "$DEST" | tail -n +2

        cd package && zip -r ../rg52mini-tv-ee47.zip .

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: rg52mini-tv-binary
        path: rg52mini-tv/rg52mini-tv

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: rg52mini-tv-package
        path: rg52mini-tv-ee47.zip

    - name: Commit binary and libs to repo
      run: |
        mkdir -p bin
        cp rg52mini-tv/rg52mini-tv bin/
        # Package all libs into a tarball for easy retrieval
        cd package/ports/rg52mini-tv && tar czf ../../../bin/rg52mini-tv-libs.tar.gz libs && cd ../../..
        git config user.name "rg52mini-tv"
        git config user.email "rg52mini@example.com"
        git add bin/rg52mini-tv bin/rg52mini-tv-libs.tar.gz
        git commit -m "Build: rg52mini-tv AArch64 binary + all libs" || echo "No changes to commit"
        git pull --rebase origin main || true
        git push || echo "Push failed"
